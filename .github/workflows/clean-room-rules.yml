name: Clean-room Rule Aggregator & Distribution

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday at midnight UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  extract-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'tools/rule_aggregator/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/rule_aggregator/requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest tools/rule_aggregator/tests -v

      - name: Set Release Version
        run: |
          VERSION=$(date -u +'%Y.%m.%d')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Compile Rules
        run: |
          mkdir -p rules
          python tools/rule_aggregator/rule_compiler.py rules/latest.json

      - name: Validate Schema Invariants
        run: |
          python tools/rule_aggregator/schema_validator.py rules/latest.json

      - name: Create Pull Request to dev
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update tracking rules (${{ env.VERSION }})"
          title: "🤖 chore(rules): auto-update tracking rules for ${{ env.VERSION }}"
          body: |
            ### Automated Rule Aggregation Report
            - **Version:** `${{ env.VERSION }}`
            - **Source:** ClearURLs + AdGuard Tracking Filter (Clean-room derivation)
            - **Validation:** Pytest passed (30/30) & Schema validated.
            
            *Vui lòng review diff tham số trước khi merge vào dev.*
          branch: "auto-update/rules-${{ env.VERSION }}"
          base: dev
          delete-branch: true
          labels: |
            automated-pr
            rules-update
