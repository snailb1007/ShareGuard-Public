name: Rules Quality & Invariant Checks

on:
  pull_request:
    branches: [ dev, main ]
  push:
    branches: [ dev ]

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'tools/rule_aggregator/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/rule_aggregator/requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest tools/rule_aggregator/tests -v

      - name: Validate rules/latest.json Schema
        run: |
          if [ ! -f rules/latest.json ]; then
            echo "Error: rules/latest.json is required but was not found." >&2
            exit 1
          fi
          python tools/rule_aggregator/schema_validator.py rules/latest.json
